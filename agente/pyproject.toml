[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "central-de-salas-agente"
version = "1.0.0"
description = "Agente A2A v1.0 (JSON-RPC) que reserva salas como host MCP, sem LLM"
requires-python = ">=3.10"
dependencies = [
    "a2a-sdk[http-server]==1.3.0",
    "httpx==0.28.1",
    "starlette==1.10.0",
    "uvicorn==0.54.0",
]

[tool.setuptools]
py-modules = ["agente", "cliente_mcp"]
